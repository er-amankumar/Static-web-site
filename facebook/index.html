<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <script src="js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row  mt-5 mx-auto">
            <div class="col-sm-5 mx-auto mt-5 pt-5">
                <img src="images/facebook.svg" alt="" height="80" class="mt-5 ms-4">
                <h3 class="ms-5">Facebook helps you connect and share with the people in your life.</h3>
            </div>
            <!-- card -->
            <div class="col-sm-4 mt-5 mx-auto">
              <form action=""> 
                <div class="card mt-5 shadow-lg" style="width: 25rem;">
                    <div class="card-body">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                            <label for="floatingInput">Email address or phone number</label>
                          </div>
                          <div class="form-floating">
                            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
                            <label for="floatingPassword">Password</label>
                            <div class="row">
                                <div class="col-sm-12 mt-4 text-center">
                                    <button type="submit" class="btn btn-primary btn-lg w-5" style="width: 100%;">Login</button>
                                </div>
                            </div>
                              <div class="text-center my-3"> <a href="#" class="text-center">Forgotten password?</a></div>
                              <hr>
                              <div class="row">
                                <div class="col-sm-12 my-4 text-center">
                                    <button type="button" class="btn btn-success btn-lg w-5" data-bs-toggle="modal" data-bs-target="#exampleModal">Create new account</button>
                                </div>
                            </div>
                            
                          </div>
                    </div>
                  </div>
                  <!--  -->
                  <p class="text-center mt-4"> <a href="#">Create a Page </a> for a celebrity, brand or business.</p>
                </form>
            </div>

        </div>
    </div>
    <!-- card end -->

     
  
  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"      aria-hidden="true">
     <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel"> Sign Up <br><span class="" style="font-size: 14px;">It's quick and easy.</span></h1>
          
           
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          
        </div>
        <div class="modal-body">
            <div class="row">
                <div class="col-sm-10 mx-auto">
                    <form action=""> 
                  <div class="row">
                    <div class="col-sm-6 form-floating mb-3">
                        <input type="text" class="form-control" id="floatingInputn" placeholder="name@example.com">
                        <label for="floatingInputn"> First Name</label>
                      </div>
                      <div class="col-sm-6 form-floating mb-3">
                        <input type="text" class="form-control" id="floatingInputsn" placeholder="name@example.com">
                        <label for="floatingInputsn">SurName</label>
                      </div>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput">Email address or phone number</label>
                  </div>
                  <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="floatingPassword" placeholder="name@example.com">
                    <label for="floatingPassword">Password</label>
                    <p style="font-size: 12px;">Date of birth ?</p>
                  </div>
                  <div class="row">
                    <div class="col-sm-4">
                        <select class="form-select" aria-label="Default select example">
                            <option selected>Date</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="1">4</option>
                            <option value="2">5</option>
                            <option value="3">6</option>
                            <option value="1">7</option>
                            <option value="2">8</option>
                            <option value="3">9</option>
                            <option value="1">10</option>
                            <option value="2">11</option>
                            <option value="3">12</option>
                            
                            <option value="1">13</option>
                            <option value="2">14</option>
                            <option value="3">15</option>
                            <option value="1">16</option>
                            <option value="2">17</option>
                            <option value="3">18</option>
                            <option value="1">19</option>
                            <option value="2">20</option>
                            <option value="3">21</option>
                            <option value="1">22</option>
                            <option value="2">23</option>
                            <option value="3">24</option>
                            <option value="3">25</option>
                            <option value="1">26</option>
                            <option value="2">27</option>
                            <option value="3">28</option>
                            <option value="1">29</option>
                            <option value="2">30</option>
                            <option value="3">31</option>
                          </select>
                    </div>
                    <div class="col-sm-4">
                        <select class="form-select" aria-label="Default select example">
                            <option selected>Month</option>
                            <option value="1">Jan</option>
                            <option value="2">Feb</option>
                            <option value="3">Mar</option>
                            <option value="4">Apr</option>
                            <option value="5">may</option>
                            <option value="6">jun</option>
                            <option value="7">july</option>
                            <option value="8">Aug</option>
                            <option value="9">Sept</option>
                            <option value="10">Oct</option>
                            <option value="11">Nov</option>
                            <option value="12">Dec</option>
                          </select>
                    </div>
                    <div class="col-sm-4">
                        <select class="form-select" aria-label="Default select example">
                            <option selected>Year</option>
                            <option value="1">2005</option>
                            <option value="2">2006</option>
                            <option value="3">2007</option>
                            <option value="1">2008</option>
                            <option value="2">2009</option>
                            <option value="3">2010</option>
                            <option value="3">2011</option>
                            <option value="1">2012</option>
                            <option value="2">2013</option>
                            <option value="3">2014</option>
                            <option value="1">2015</option>
                            <option value="2">2016</option>
                            <option value="3">2017</option>
                            <option value="1">2018</option>
                            <option value="2">2019</option>
                            <option value="3">2020</option>
                            <option value="3">2021</option>
                            <option value="1">2022</option>
                            <option value="2">2023</option>
                            <option value="3">2024</option>
                          </select>
                    </div>
                  </div>
                  <!-- gender -->
                   <div class="row mx-auto">
                    <p>Gender ?</p>
                    <div class="col-sm-3 border border-black ms-4">
                      Female  <input type="radio" value="female" name="gender"> 
                    </div>
                    <div class="col-sm-3 border border-black ms-4">
                        Male  <input type="radio" value="male" name="gender"> 
                    </div>
                    <div class="col-sm-3 border border-black ms-4">
                        Other  <input type="radio" value="other" name="gender"> 
                    </div>
                   </div>
                  <!-- gender end -->

                  <div class="row">
                    <div class="col-sm-12 my-4 text-center">
                        <button type="submit" class="btn btn-success btn-lg w-5" >Sign Up</button>
                    </div>
                </div>
              </form>
                </div>
            </div>
           
        </div>
         
      </div>
    </div>
  </div>
    

</body>
</html>
