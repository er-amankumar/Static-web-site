<html>
<head>
<script>
function req(){
//alert("hii");
var first=document.getElementById("f").value;
var last=document.getElementById("L").value;
var fName=document.getElementById("father").value;
var mName=document.getElementById("mother").value;
if (first==""){
document.getElementById("first").innerHTML="Invalid name";
document.getElementById("first").style.color="red";
}
else{

}

 if (last==""){
document.getElementById("last").innerHTML="Invalid name";

}
else{
document.getElementById("last").innerHTML="";
document.getElementById("last").style.color="";
}


 if (fName==""){
document.getElementById("fname").innerHTML="Invalid name";

}
else{

 if (mName==""){

else{

}


}

</script>

</head>
<body>
<table>

</html>
