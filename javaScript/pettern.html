<html>
<head>
<script>
function ch(){
//alert("hi");
var name=document.getElementById("tb").value;
var pname=/^[a-zA-Z ]{3,15}$/;
var no=document.getElementById("no").value;
var pno=/^[0-9]{10}$/
//alert(name)
if (!pname.test(name)){
//alert(name)
document.getElementById("sp").innerHTML="Invalid name";
document.getElementById("sp").style.color="red";
document.getElementById("tb").style.border="1px solid red";
}
else{
document.getElementById("sp").innerHTML="";
}
if (!pno.test(no)){
//alert(name)
document.getElementById("num").innerHTML="Invalid no.";
document.getElementById("num").style.color="red";
document.getElementById("no").style.border="1px solid red";
}
else{
document.getElementById("num").innerHTML="";
}


}
</script>
</head>
<body>
Enter name
<input type="text" id="tb"/>
<span id="sp"></span>
<br/>
<br/>
Enter mobile no. <input type="number" id="no"/><span id="num"></span>
<br/>
<br/>
<input type="button" onclick="ch()" value="button"/>

</body>
</html>
