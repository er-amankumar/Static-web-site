<html>
<head>
<script>
function ch(){
//alert("hii");
var pass=document.getElementById("sp").value;
//alert(pass);
if (pass.length<=4){
document.getElementById("dp").innerHTML="weak password";
document.getElementById("dp").style.color="red";
 
}
else if (pass.length>=4 && pass.length<=6){
document.getElementById("dp").innerHTML="medium  password";
document.getElementById("dp").style.color="blue";
}
else {
document.getElementById("dp").innerHTML="strong  password";
document.getElementById("dp").style.color="green";
}



}

</script>
</head>
<body>
<input type="password" id="sp" onkeyup="ch()"/>
<span id="dp"></span>


</body>
</html>
