<html>
<head>
<script>
function sum(){
var num1=+document.getElementById("n1").value;
var num2=+document.getElementById("n2").value;
document.getElementById("res").value=num1+num2;
}
function sub(){
var num1=+document.getElementById("n1").value;
var num2=+document.getElementById("n2").value;
document.getElementById("res").value=num1-num2;
}
function div(){
var num1=+document.getElementById("n1").value;
var num2=+document.getElementById("n2").value;
document.getElementById("res").value=num1/num2;
}
function multi(){
var num1=+document.getElementById("n1").value;
var num2=+document.getElementById("n2").value;
document.getElementById("res").value=num1*num2;
}

</script>

<style>
div{
height:250px;
width:300px;
border:2px solid;
background-color:lightgrey;
margin:0 auto;
margin-top:50px;

}
</style>
</head>
<body>
<div>
 
<table>
<tr><td>
Enter First no.</td>
<td>
<input type="text" id="n1"/>
</td></tr>
<br/>
<br/>
<tr><td>
Enter Second no. </td>
<td>
<input type="text" id="n2"/>
</td></tr>
<br/>
<tr><td>
<span>Result</span></td>
<td>
<input type="text" id="res"/></td></tr></table>
<br/>
<input type="button" value="+" onclick="sum()" style="margin-left:110px;"/>
<input type="button" value="-" onclick="sub()"/>
<input type="button" value="/" onclick="div()"/>
<input type="button" value="x" onclick="multi()"/>
</div>
</body>

</html>
