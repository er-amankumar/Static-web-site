<html>
<head>
<script>
function km(){
//alert("hi");
var m=+document.getElementById("km").value;
document.getElementById("res").innerHTML=m/1000+ "km";
}
function m(){
//alert("hi");
var m=+document.getElementById("km").value;
document.getElementById("res").innerHTML=m*1000+"m";
}


</script>
<style>
div{
height:300px;
width:300px;
border:2px solid;
background-color:lightgrey;
margin:0 auto;
margin-top:200px;
}
span{
margin-left:30px;
font-size:20px;
}
input{
height:40px;
}
.btn{
margin-top:50px;
margin-left:50px;
}
#res{
margin-top:40px;
}
</style>

</head>
<body>
<div>
<h1>Kilometer Converter</h1>
<span>Enter </span> <input type="text" id="km"/>
<br/>
<span id="res"></span>
<br/><br/>
<input type="button" value="kilometer" onclick="km()" class="btn"/>
<input type="button" value="meter" onclick="m()" class="btn"/>
</div>
</body>
</html>
